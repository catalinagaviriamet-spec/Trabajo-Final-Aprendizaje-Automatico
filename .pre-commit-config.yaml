repos:
  - repo: local
    hooks:
      - id: notebook-outputs
        name: No publicar outputs de notebooks
        entry: uv run python -m scripts.notebook_outputs --check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, jupyter]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, jupyter]
